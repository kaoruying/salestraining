<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凱基人壽主管課程</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 168, 40, 0.18), transparent 35%),
        linear-gradient(135deg, #061b3a 0%, #082b5c 45%, #031226 100%);
      color: #fff;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 56px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 360px;
      height: 360px;
      background: rgba(255, 170, 50, 0.16);
      filter: blur(80px);
      border-radius: 50%;
      right: -120px;
      top: 120px;
      z-index: 0;
    }

    .hero {
      text-align: center;
      max-width: 920px;
      position: relative;
      z-index: 1;
      margin-bottom: 48px;
    }

    .tag {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      font-size: 15px;
      letter-spacing: 2px;
      color: #ffd28a;
      margin-bottom: 22px;
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: 2px;
      text-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }

    h1 span {
      color: #ffb13b;
    }

    .subtitle {
      margin-top: 22px;
      font-size: clamp(17px, 2.4vw, 22px);
      line-height: 1.8;
      color: rgba(255,255,255,0.82);
    }

    .course-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .course-card {
      text-decoration: none;
      color: #fff;
      padding: 30px;
      min-height: 260px;
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.26);
      backdrop-filter: blur(14px);
      transition: 0.35s ease;
      position: relative;
      overflow: hidden;
    }

    .course-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,177,59,0.25), transparent 55%);
      opacity: 0;
      transition: 0.35s ease;
    }

    .course-card:hover {
      transform: translateY(-10px);
      border-color: rgba(255,177,59,0.75);
      box-shadow: 0 26px 70px rgba(0,0,0,0.38);
    }

    .course-card:hover::before {
      opacity: 1;
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffb13b, #ff7a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 24px;
      box-shadow: 0 10px 24px rgba(255,122,26,0.35);
      position: relative;
      z-index: 1;
    }

    .course-card h2 {
      font-size: 28px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .course-card p {
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255,255,255,0.78);
      position: relative;
      z-index: 1;
    }

    .enter {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #ffd28a;
      position: relative;
      z-index: 1;
    }

    .footer {
      margin-top: 46px;
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 900px) {
      .course-grid {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 40px 18px;
        justify-content: flex-start;
      }

      .hero {
        margin-top: 36px;
        margin-bottom: 30px;
      }

      .course-card {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="glow"></div>

    <section class="hero">
      <div class="tag">KGI LIFE TRAINING PROGRAM</div>
      <h1>凱基人壽<br><span>主管課程</span></h1>
      <p class="subtitle">
        從主任、襄理到經理，<br>
        依職涯階段打造完整培育路徑，<br>
        協助業務夥伴累積專業、提升管理力，<br>
        穩健邁向下一階段。<br>
      </p>
    </section>

    <section class="course-grid">
 <a href="https://kaoruying.github.io/astraning/" class="course-card">
        <div class="icon">🚀</div>
        <h2>業務主任課程</h2>
        <p>
          聚焦高效行銷、增員啟動、取得名單、增員接觸，探詢需求，協助主任建立帶人與推動組織成長的核心能力。
        </p>
        <div class="enter">進入課程介紹 →</div>
      </a>

      <a href="assistant-manager.html" class="course-card">
        <div class="icon">📈</div>
        <h2>業務襄理課程</h2>
        <p>
          強化團隊經營、聚焦輔導、活動管理與主管培育能力，協助襄理從個人帶動走向組織擴展。
        </p>
        <div class="enter">進入課程介紹 →</div>
      </a>

      <a href="manager.html" class="course-card">
        <div class="icon">🏆</div>
        <h2>業務經理課程</h2>
        <p>
          培養策略思維、經營視角與領導影響力，協助經理掌握組織發展與績效推進關鍵。
        </p>
        <div class="enter">進入課程介紹 →</div>
      </a>
    </section>

    <div class="footer">
      凱基人壽｜業務訓練部
    </div>
  </main>
</body>
</html>
