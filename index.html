<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>凱基人壽主管課程</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

html, body {
  width: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #061b3a 0%, #082b5c 45%, #031226 100%);
  color: #fff;
}

.page {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 56px 24px 42px;
  position: relative;
}

.glow {
  position: fixed;
  width: 280px;
  height: 280px;
  background: rgba(255, 170, 50, 0.14);
  filter: blur(80px);
  border-radius: 50%;
  right: -120px;
  top: 80px;
  pointer-events: none;
  z-index: 0;
}

.hero {
  text-align: center;
  max-width: 920px;
  margin: 0 auto 48px;
  position: relative;
  z-index: 1;
}

.tag {
  display: inline-block;
  padding: 8px 18px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 999px;
  font-size: 15px;
  letter-spacing: 2px;
  color: #ffd28a;
  margin-bottom: 22px;
  white-space: nowrap;
}

h1 {
  font-size: clamp(38px, 7vw, 76px);
  font-weight: 900;
  line-height: 1.12;
  letter-spacing: 2px;
  text-shadow: 0 8px 28px rgba(0,0,0,0.35);
}

h1 span {
  color: #ffb13b;
}

.subtitle {
  margin-top: 22px;
  font-size: clamp(17px, 2.4vw, 22px);
  line-height: 1.8;
  color: rgba(255,255,255,0.82);
  word-break: keep-all;
}

.course-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  position: relative;
  z-index: 1;
}

.course-card {
  text-decoration: none;
  color: #fff;
  padding: 30px;
  min-height: 260px;
  border-radius: 28px;
  background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 20px 50px rgba(0,0,0,0.26);
  transition: 0.28s ease;
  position: relative;
  overflow: hidden;
}

.course-card:hover {
  transform: translateY(-8px);
  border-color: rgba(255,177,59,0.75);
}

.icon {
  width: 58px;
  height: 58px;
  border-radius: 18px;
  background: linear-gradient(135deg, #ffb13b, #ff7a1a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin-bottom: 24px;
  box-shadow: 0 10px 24px rgba(255,122,26,0.35);
}

.course-card h2 {
  font-size: 28px;
  margin-bottom: 14px;
}

.course-card p {
  font-size: 16px;
  line-height: 1.8;
  color: rgba(255,255,255,0.78);
}

.enter {
  margin-top: 28px;
  display: inline-flex;
  font-weight: 700;
  color: #ffd28a;
}

.footer {
  margin-top: 46px;
  color: rgba(255,255,255,0.55);
  font-size: 14px;
  text-align: center;
}

/* 手機穩定版 */
@media (max-width: 900px) {
  .page {
    padding: 38px 16px 34px;
  }

  .glow {
    width: 220px;
    height: 220px;
    right: -140px;
    top: 20px;
    opacity: 0.7;
  }

  .hero {
    margin-bottom: 30px;
  }

  .tag {
    font-size: 12px;
    letter-spacing: 1px;
    padding: 7px 14px;
  }

  h1 {
    font-size: 40px;
    line-height: 1.18;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 16px;
    line-height: 1.75;
    max-width: 320px;
    margin-left: auto;
    margin-right: auto;
  }

  .course-grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .course-card {
    min-height: auto;
    padding: 24px;
    border-radius: 24px;
  }

  .course-card:hover {
    transform: none;
  }

  .icon {
    width: 52px;
    height: 52px;
    font-size: 26px;
    margin-bottom: 18px;
  }

  .course-card h2 {
    font-size: 24px;
  }

  .course-card p {
    font-size: 15px;
    line-height: 1.75;
  }

  .enter {
    margin-top: 20px;
  }
}
</style>
</head>

<body>
<main class="page">
  <div class="glow"></div>

  <section class="hero">
    <div class="tag">KGI LIFE TRAINING PROGRAM</div>

    <h1>凱基人壽<br><span>主管課程</span></h1>

    <p class="subtitle">
      從主任、襄理到經理，依職涯階段打造完整培育路徑，協助業務夥伴累積專業、提升管理力，穩健邁向下一階段。
    </p>
  </section>

  <section class="course-grid">
    <a href="https://kaoruying.github.io/astraning/" class="course-card">
      <div class="icon">🚀</div>
      <h2>業務主任課程</h2>
      <p>聚焦高效行銷、增員啟動、取得名單、增員接觸、探詢需求，協助主任建立帶人與推動組織成長的核心能力。</p>
      <div class="enter">進入課程介紹 →</div>
    </a>

    <a href="assistant-manager.html" class="course-card">
      <div class="icon">📈</div>
      <h2>業務襄理課程</h2>
      <p>強化團隊經營、聚焦輔導、活動管理與主管培育能力，協助襄理從個人帶動走向組織擴展。</p>
      <div class="enter">進入課程介紹 →</div>
    </a>

    <a href="manager.html" class="course-card">
      <div class="icon">🏆</div>
      <h2>業務經理課程</h2>
      <p>培養策略思維、經營視角與領導影響力，協助經理掌握組織發展與績效推進關鍵。</p>
      <div class="enter">進入課程介紹 →</div>
    </a>
  </section>

  <div class="footer">
    凱基人壽｜業務訓練部
  </div>
</main>
</body>
</html>
