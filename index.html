    h1 {

      word-break: normal;

    .layout {
      display: grid;
      gap: 18px;
      max-width: 100%;

    .panel {
      position: relative;
      max-width: 100%;
      border-radius: 26px;

      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(0, 114, 206, 0.16), transparent 42%),

      color: #ffffff;

    .section-desc {

      line-height: 1.8;
      color: rgba(226, 237, 255, 0.78);
      margin-bottom: 16px;
      white-space: normal;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .staircase-wrap {
      position: relative;
      height: 340px;
      max-width: 100%;
      overflow: hidden;
      border-radius: 22px;
      background:

      border: 1px solid rgba(120, 180, 235, 0.18);
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.25),
        inset 0 0 26px rgba(0, 112, 204, 0.12);
      scroll-margin-top: 18px;
    }

    .staircase-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.032) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .stairs {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 250px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      max-width: 100%;
      overflow: hidden;
    }

    .step-bar {
      flex: 1;
      border-radius: 10px 10px 0 0;
      background:
        linear-gradient(180deg, #1fa4ff 0%, #006ec7 42%, #003f8c 100%);
      position: relative;
      box-shadow:
        inset 0 -12px 18px rgba(0, 0, 0, 0.24),
        0 0 18px rgba(0, 116, 210, 0.22);
      animation: rise 0.9s ease both;
      transform-origin: bottom;
    }

    .step-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.24), transparent 45%),
        linear-gradient(180deg, rgba(255,255,255,0.10), transparent 40%);
      border-radius: 10px 10px 0 0;
    }

    @keyframes rise {
      from {
        transform: scaleY(0);
        opacity: 0.3;
      }
      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .bar1 { height: 24px; animation-delay: 0.05s; }
    .bar2 { height: 40px; animation-delay: 0.10s; }
    .bar3 { height: 58px; animation-delay: 0.15s; }
    .bar4 { height: 76px; animation-delay: 0.20s; }
    .bar5 { height: 96px; animation-delay: 0.25s; }
    .bar6 { height: 118px; animation-delay: 0.30s; }
    .bar7 { height: 140px; animation-delay: 0.35s; }
    .bar8 { height: 164px; animation-delay: 0.40s; }
    .bar9 { height: 188px; animation-delay: 0.45s; }
    .bar10 { height: 212px; animation-delay: 0.50s; }
    .bar11 { height: 236px; animation-delay: 0.55s; }
    .bar12 { height: 250px; animation-delay: 0.60s; }

    .tech-line {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      width: 100%;
      height: 100%;
      max-width: 100%;
    }

    .milestone {
      position: absolute;
      z-index: 5;
      transform: translate(-50%, -50%);
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .milestone-box {
      min-width: 78px;
      padding: 10px 8px;
      border-radius: 16px;
      background:
        linear-gradient(160deg, rgba(0, 48, 105, 0.98), rgba(0, 26, 62, 0.92));
      border: 1px solid rgba(120, 190, 255, 0.38);
      box-shadow:
        0 10px 24px rgba(0,0,0,0.34),
        0 0 0 1px rgba(0, 120, 210, 0.10) inset,
        0 0 18px rgba(0, 120, 210, 0.18);
      transition: 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .milestone.active .milestone-box {
      transform: translateY(-2px) scale(1.04);
      border-color: rgba(255, 214, 120, 0.82);
      box-shadow:
        0 14px 28px rgba(0,0,0,0.36),
        0 0 0 1px rgba(255, 168, 38, 0.22) inset,
        0 0 28px rgba(255, 168, 38, 0.38);
      background:
        linear-gradient(160deg, rgba(255, 168, 38, 0.98), rgba(255, 123, 0, 0.94));
    }

    .milestone-name {
      display: block;
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
    }

    .milestone-sub {
      display: block;
      margin-top: 4px;
      font-size: 10.5px;
      color: rgba(255,255,255,0.86);
      font-weight: 800;
      letter-spacing: 0.2px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .milestone-director { left: 22%; top: 76%; }
    .milestone-assistant { left: 44%; top: 59%; }
    .milestone-manager { left: 66%; top: 40%; }
    .milestone-branch { left: 80%; top: 22%; }

    .tap-hint {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 168, 38, 0.24), rgba(255, 123, 0, 0.13));
      border: 1px solid rgba(255, 196, 100, 0.46);

      box-shadow:

    .tap-main {

    .tap-sub {

      font-size: 13px;
      font-weight: 800;

    .detail-panel {

      max-width: 100%;

      background: linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(245, 249, 255, 0.99));
      color: #0b1b38;
      padding: 18px;

    .detail-head {

    .detail-intro {

    .info-list {

    .detail-btn {

    .detail-btn.primary {

    .footer {

  <main class="page">

    const detailPanel = document.getElementById("detailPanel");
    const milestones = document.querySelectorAll(".milestone");

    function renderDetail(roleKey) {
      const data = roleData[roleKey];

      detailPanel.innerHTML = `
        <div class="detail-head">
          <div class="detail-title-wrap">
            <h2>${data.title}</h2>
            <div class="detail-badge">${data.badge}</div>
          </div>
          <div class="detail-icon">${data.icon}</div>
        </div>

        <div class="detail-intro">${data.intro}</div>

        <div class="info-list">
          <div class="info-box">
            <b>適合對象</b>
            <span>${data.target}</span>
          </div>

          <div class="info-box">
            <b>訓練重點</b>
            <span>${data.focus}</span>
          </div>

          <div class="info-box">
            <b>學完收穫</b>
            <span>${data.result}</span>
          </div>
        </div>

        <div class="detail-tags">
          ${data.tags.map(tag => `<span>${tag}</span>`).join("")}
        </div>

        <div class="detail-actions">
          <a class="detail-btn primary" href="${data.primaryLink}">${data.primaryText}</a>
          <a class="detail-btn secondary" href="#staircaseMap" onclick="document.getElementById('staircaseMap').scrollIntoView({behavior:'smooth', block:'center'}); return false;">回到晉升階梯</a>
        </div>
      `;
    }

    function scrollToDetail() {
      setTimeout(() => {
        detailPanel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 80);
    }

    milestones.forEach(btn => {
      btn.addEventListener("click", () => {
        milestones.forEach(item => item.classList.remove("active"));
        btn.classList.add("active");

        renderDetail(btn.dataset.role);
        scrollToDetail();
      });
    });

    renderDetail("director");

    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    document.addEventListener("copy", function(e) {
      e.preventDefault();
    });

    document.addEventListener("cut", function(e) {
      e.preventDefault();
    });

    document.addEventListener("selectstart", function(e) {
      e.preventDefault();
    });

    document.addEventListener("dragstart", function(e) {
      e.preventDefault();
    });

    document.addEventListener("keydown", function(e) {
      const key = e.key.toLowerCase();

      if (
        (e.ctrlKey || e.metaKey) &&
        ["c", "x", "a", "s", "u", "p"].includes(key)
      ) {
        e.preventDefault();
      }

      if (e.key === "F12") {
        e.preventDefault();
      }

      if (
        (e.ctrlKey || e.metaKey) &&
        e.shiftKey &&
        ["i", "j", "c"].includes(key)
      ) {
        e.preventDefault();
      }
    });
  </script>
