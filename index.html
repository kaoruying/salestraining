<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凱基人壽主管培育地圖</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 12% 8%, rgba(0, 79, 158, 0.42), transparent 26%),
        radial-gradient(circle at 88% 16%, rgba(255, 168, 38, 0.18), transparent 24%),
        radial-gradient(circle at 50% 88%, rgba(0, 118, 190, 0.18), transparent 30%),
        linear-gradient(160deg, #020b1f 0%, #003b7a 42%, #001a3a 72%, #020814 100%);
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      width: 100%;
      max-width: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(rgba(0, 140, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 140, 255, 0.045) 1px, transparent 1px);
      background-size: 28px 28px, 28px 28px, 112px 112px, 112px 112px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0%, rgba(0, 133, 210, 0.09) 42%, transparent 74%),
        linear-gradient(20deg, transparent 0%, rgba(255, 168, 38, 0.035) 50%, transparent 78%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 460px);
      max-width: 100%;
      margin: 0 auto;
      padding: 22px 14px 40px;
      overflow-x: hidden;
    }

    .hero {
      text-align: center;
      padding: 10px 4px 22px;
      max-width: 100%;
      overflow-x: hidden;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 196, 100, 0.48);
      background: rgba(255, 168, 38, 0.12);
      color: #ffd28a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow:
        0 0 0 1px rgba(255, 168, 38, 0.08) inset,
        0 0 18px rgba(255, 168, 38, 0.18);
      backdrop-filter: blur(10px);
      max-width: 100%;
      white-space: normal;
      text-align: center;
    }

    h1 {
      margin-top: 14px;
      font-size: 32px;
      line-height: 1.18;
      font-weight: 900;
      letter-spacing: 0.4px;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      max-width: 100%;
    }

    h1 .accent {
      background: linear-gradient(135deg, #fff2c6, #ffc247 45%, #ff8a00 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 168, 38, 0.26));
    }

    .subtitle {
      margin-top: 12px;
      color: rgba(238, 246, 255, 0.86);
      font-size: 15px;
      line-height: 1.85;
      word-break: normal;
      overflow-wrap: break-word;
      max-width: 100%;
    }

    .layout {
      display: grid;
      gap: 18px;
      max-width: 100%;
      overflow-x: hidden;
    }

    .panel {
      position: relative;
      border-radius: 26px;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.115), rgba(255,255,255,0.045)),
        linear-gradient(135deg, rgba(0, 80, 160, 0.34), rgba(0, 22, 52, 0.28));
      border: 1px solid rgba(120, 180, 235, 0.20);
      box-shadow:
        0 18px 42px rgba(0,0,0,0.34),
        inset 0 0 42px rgba(0, 86, 168, 0.16);
      backdrop-filter: blur(14px);
      overflow: hidden;
      max-width: 100%;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(0, 114, 206, 0.16), transparent 42%),
        radial-gradient(circle at 85% 12%, rgba(255, 168, 38, 0.14), transparent 20%),
        radial-gradient(circle at 18% 92%, rgba(0, 90, 180, 0.22), transparent 26%);
      pointer-events: none;
    }

    .panel-inner {
      position: relative;
      z-index: 1;
      padding: 18px 14px 18px;
      max-width: 100%;
      overflow-x: hidden;
    }

    .section-title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 6px;
      color: #ffffff;
      max-width: 100%;
    }

    .section-desc {
      font-size: 14px;
      line-height: 1.8;
      color: rgba(226, 237, 255, 0.74);
      margin-bottom: 16px;
      max-width: 100%;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .staircase-wrap {
      position: relative;
      height: 320px;
      overflow: hidden;
      border-radius: 22px;
      background:
        radial-gradient(circle at 20% 12%, rgba(0, 114, 206, 0.24), transparent 25%),
        linear-gradient(180deg, rgba(2, 20, 48, 0.86), rgba(0, 51, 110, 0.50));
      border: 1px solid rgba(120, 180, 235, 0.18);
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.25),
        inset 0 0 26px rgba(0, 112, 204, 0.12);
      width: 100%;
      max-width: 100%;
      contain: layout paint;
    }

    .staircase-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.032) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .stairs {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 230px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      max-width: 100%;
    }

    .step-bar {
      flex: 1;
      border-radius: 10px 10px 0 0;
      background:
        linear-gradient(180deg, #1fa4ff 0%, #006ec7 42%, #003f8c 100%);
      position: relative;
      box-shadow:
        inset 0 -12px 18px rgba(0, 0, 0, 0.24),
        0 0 18px rgba(0, 116, 210, 0.22);
      animation: rise 0.9s ease both;
      transform-origin: bottom;
      min-width: 0;
    }

    .step-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.24), transparent 45%),
        linear-gradient(180deg, rgba(255,255,255,0.10), transparent 40%);
      border-radius: 10px 10px 0 0;
    }

    @keyframes rise {
      from {
        transform: scaleY(0);
        opacity: 0.3;
      }
      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .bar1 { height: 26px; animation-delay: 0.05s; }
    .bar2 { height: 44px; animation-delay: 0.10s; }
    .bar3 { height: 62px; animation-delay: 0.15s; }
    .bar4 { height: 80px; animation-delay: 0.20s; }
    .bar5 { height: 102px; animation-delay: 0.25s; }
    .bar6 { height: 124px; animation-delay: 0.30s; }
    .bar7 { height: 146px; animation-delay: 0.35s; }
    .bar8 { height: 168px; animation-delay: 0.40s; }
    .bar9 { height: 192px; animation-delay: 0.45s; }
    .bar10 { height: 216px; animation-delay: 0.50s; }

    .tech-line {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      max-width: 100%;
    }

    .milestone {
      position: absolute;
      z-index: 5;
      transform: translate(-50%, -50%);
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      max-width: 100%;
    }

    .milestone-box {
      min-width: 78px;
      padding: 10px 10px;
      border-radius: 16px;
      background:
        linear-gradient(160deg, rgba(0, 48, 105, 0.98), rgba(0, 26, 62, 0.92));
      border: 1px solid rgba(120, 190, 255, 0.38);
      box-shadow:
        0 10px 24px rgba(0,0,0,0.34),
        0 0 0 1px rgba(0, 120, 210, 0.10) inset,
        0 0 18px rgba(0, 120, 210, 0.18);
      transition: 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .milestone.active .milestone-box {
      transform: translateY(-2px) scale(1.04);
      border-color: rgba(255, 214, 120, 0.82);
      box-shadow:
        0 14px 28px rgba(0,0,0,0.36),
        0 0 0 1px rgba(255, 168, 38, 0.22) inset,
        0 0 28px rgba(255, 168, 38, 0.38);
      background:
        linear-gradient(160deg, rgba(255, 168, 38, 0.98), rgba(255, 123, 0, 0.94));
    }

    .milestone-name {
      display: block;
      font-size: 14px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }

    .milestone-sub {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: rgba(255,255,255,0.86);
      font-weight: 800;
      letter-spacing: 0.2px;
      line-height: 1.35;
    }

    .milestone-director {
      left: 28%;
      top: 73%;
    }

    .milestone-assistant {
      left: 54%;
      top: 50%;
    }

    .milestone-manager {
      left: 80%;
      top: 27%;
    }

    .tap-hint {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255, 168, 38, 0.24), rgba(255, 123, 0, 0.13));
      border: 1px solid rgba(255, 196, 100, 0.46);
      color: #ffd28a;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
      box-shadow:
        0 0 18px rgba(255, 168, 38, 0.18),
        inset 0 0 0 1px rgba(255,255,255,0.05);
      line-height: 1.5;
      max-width: 100%;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .detail-panel {
      position: relative;
      z-index: 1;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(245, 249, 255, 0.99));
      color: #0b1b38;
      padding: 18px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.28);
      max-width: 100%;
      overflow-x: hidden;
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      max-width: 100%;
      min-width: 0;
    }

    .detail-title-wrap {
      min-width: 0;
      max-width: 100%;
    }

    .detail-title-wrap h2 {
      font-size: 25px;
      line-height: 1.2;
      font-weight: 900;
      color: #062a55;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .detail-badge {
      margin-top: 7px;
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff4df;
      color: #d96b00;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(217, 107, 0, 0.12);
      max-width: 100%;
      white-space: normal;
    }

    .detail-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffb13b, #ff7a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 10px 20px rgba(255,122,26,0.24);
    }

    .detail-intro {
      color: #34415a;
      font-size: 15px;
      line-height: 1.85;
      font-weight: 600;
      margin-bottom: 15px;
      max-width: 100%;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .info-list {
      display: grid;
      gap: 10px;
      max-width: 100%;
    }

    .info-box {
      border-radius: 16px;
      background: #f3f7ff;
      border-left: 5px solid #ff8a00;
      padding: 13px 14px;
      max-width: 100%;
    }

    .info-box b {
      display: block;
      color: #062a55;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 5px;
      max-width: 100%;
    }

    .info-box span {
      display: block;
      color: #34415a;
      font-size: 14px;
      line-height: 1.75;
      font-weight: 600;
      max-width: 100%;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .detail-tags {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 100%;
      overflow-x: hidden;
    }

    .detail-tags span {
      padding: 7px 11px;
      border-radius: 999px;
      background: #eef4ff;
      color: #062a55;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(6, 42, 85, 0.08);
      max-width: 100%;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .detail-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 100%;
      overflow-x: hidden;
    }

    .detail-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      transition: 0.2s ease;
      max-width: 100%;
      white-space: normal;
      text-align: center;
    }

    .detail-btn.primary {
      background: linear-gradient(135deg, #ffb13b, #ff7a1a);
      color: #ffffff;
      box-shadow: 0 10px 18px rgba(255,122,26,0.24);
    }

    .detail-btn.secondary {
      background: #eef4ff;
      color: #062a55;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: rgba(255,255,255,0.56);
      font-size: 13px;
      line-height: 1.7;
      max-width: 100%;
      overflow-x: hidden;
    }

    @media (min-width: 768px) {
      .page {
        width: min(100%, 1000px);
        padding: 28px 20px 42px;
      }

      .layout {
        grid-template-columns: 1.05fr 0.95fr;
        align-items: start;
      }

      .detail-panel {
        position: sticky;
        top: 20px;
      }

      h1 {
        font-size: 48px;
      }

      .subtitle {
        font-size: 16px;
      }
    }

    @media (max-width: 767px) {
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden !important;
      }

      body {
        min-width: 0;
      }

      .page {
        width: 100%;
        max-width: 460px;
        margin-left: auto;
        margin-right: auto;
        padding-left: 12px;
        padding-right: 12px;
        overflow-x: hidden;
      }

      .layout {
        width: 100%;
        max-width: 100%;
        display: grid;
        grid-template-columns: 1fr;
        overflow-x: hidden;
      }

      .panel,
      .detail-panel {
        width: 100%;
        max-width: 100%;
      }

      .panel-inner {
        width: 100%;
        max-width: 100%;
      }

      .staircase-wrap {
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }

      .subtitle br {
        display: none;
      }

      .subtitle {
        font-size: 15px;
        line-height: 1.8;
        word-break: normal !important;
        overflow-wrap: break-word !important;
      }

      .detail-head {
        max-width: 100%;
        min-width: 0;
      }

      .detail-title-wrap {
        min-width: 0;
      }

      .detail-title-wrap h2 {
        word-break: break-word;
        overflow-wrap: break-word;
      }

      .info-box,
      .info-box span,
      .detail-intro {
        max-width: 100%;
        word-break: normal;
        overflow-wrap: break-word;
      }

      .detail-actions {
        width: 100%;
      }

      .detail-btn {
        flex: 1 1 100%;
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .page {
        padding: 18px 10px 34px;
      }

      h1 {
        font-size: 29px;
      }

      .panel-inner {
        padding-left: 12px;
        padding-right: 12px;
      }

      .milestone-box {
        min-width: 68px;
        padding: 9px 8px;
      }

      .milestone-name {
        font-size: 13px;
      }

      .milestone-sub {
        font-size: 10px;
      }

      .staircase-wrap {
        height: 300px;
      }

      .tap-hint {
        font-size: 13px;
        border-radius: 18px;
      }

      .milestone-manager {
        left: 78%;
      }
    }

    @media (max-width: 360px) {
      .milestone-director {
        left: 27%;
      }

      .milestone-assistant {
        left: 53%;
      }

      .milestone-manager {
        left: 76%;
      }

      .milestone-box {
        min-width: 64px;
        padding-left: 6px;
        padding-right: 6px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="tag">凱基人壽主管培育地圖</div>

      <h1>
        主管職涯<br>
        <span class="accent">晉升階梯</span>
      </h1>

      <p class="subtitle">
        從主任、襄理到經理，打造每一步都接得上的主管培育路徑。<br>
        讓晉升不只是職級改變，而是能力真正升級。
      </p>
    </section>

    <div class="layout">
      <section class="panel">
        <div class="panel-inner">
          <div class="section-title">晉升階梯</div>
          <div class="section-desc">
            由下而上，代表從帶人起步，到團隊帶動，再到經營領導的能力進程。
          </div>

          <div class="staircase-wrap">
            <div class="stairs">
              <div class="step-bar bar1"></div>
              <div class="step-bar bar2"></div>
              <div class="step-bar bar3"></div>
              <div class="step-bar bar4"></div>
              <div class="step-bar bar5"></div>
              <div class="step-bar bar6"></div>
              <div class="step-bar bar7"></div>
              <div class="step-bar bar8"></div>
              <div class="step-bar bar9"></div>
              <div class="step-bar bar10"></div>
            </div>

            <svg class="tech-line" viewBox="0 0 100 100" preserveAspectRatio="none">
              <defs>
                <linearGradient id="lineGlow" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#6fc7ff" stop-opacity="0.85"/>
                  <stop offset="55%" stop-color="#ffcf6b" stop-opacity="0.95"/>
                  <stop offset="100%" stop-color="#ff8a00" stop-opacity="1"/>
                </linearGradient>
              </defs>
              <polyline
                points="12,82 28,73 54,50 80,27 92,18"
                fill="none"
                stroke="url(#lineGlow)"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <button class="milestone milestone-director active" data-role="director" aria-label="主任">
              <div class="milestone-box">
                <span class="milestone-name">主任</span>
                <span class="milestone-sub">帶人起步</span>
              </div>
            </button>

            <button class="milestone milestone-assistant" data-role="assistant" aria-label="襄理">
              <div class="milestone-box">
                <span class="milestone-name">襄理</span>
                <span class="milestone-sub">團隊帶動</span>
              </div>
            </button>

            <button class="milestone milestone-manager" data-role="manager" aria-label="經理">
              <div class="milestone-box">
                <span class="milestone-name">經理</span>
                <span class="milestone-sub">經營領導</span>
              </div>
            </button>
          </div>

          <div class="tap-hint">
            👆 點選「主任／襄理／經理」，查看各職級訓練簡介
          </div>
        </div>
      </section>

      <section>
        <div id="detailPanel" class="detail-panel"></div>
      </section>
    </div>

    <div class="footer">
      凱基人壽｜業務訓練部
    </div>
  </main>

  <script>
    const roleData = {
      director: {
        icon: "🚀",
        title: "業務主任課程",
        badge: "增員實戰起步",
        intro: "主任階段的關鍵，在於從個人業績延伸到帶人與增員推進。課程聚焦高效行銷、增員啟動、取得名單、增員接觸與探詢需求，協助主任建立帶人與推動組織成長的核心能力。",
        target: "適合剛晉升主任，準備啟動增員與帶人基本功的夥伴。",
        focus: "高效行銷、增員啟動、取得名單、增員接觸、探詢需求。",
        result: "學完後可更清楚掌握主任在增員流程中的角色與推進做法。",
        tags: ["高效行銷", "增員啟動", "取得名單", "增員接觸", "探詢需求"],
        primaryText: "查看主任課程",
        primaryLink: "https://kaoruying.github.io/astraning/"
      },

      assistant: {
        icon: "📈",
        title: "業務襄理課程",
        badge: "團隊經營進階",
        intro: "襄理課程聚焦團隊經營、聚焦輔導、活動管理與主管培育能力，協助襄理從個人帶動走向組織擴展，建立更穩定的團隊發展動能。",
        target: "適合已具備基本帶人能力，準備加強團隊經營與主管育成的襄理。",
        focus: "團隊經營、聚焦輔導、活動管理、主管培育。",
        result: "學完後可更有系統地陪跑團隊，提升組織延續與成長力。",
        tags: ["團隊經營", "聚焦輔導", "活動管理", "主管育成"],
        primaryText: "查看襄理課程",
        primaryLink: "https://kaoruying.github.io/sastraining/"

      manager: {
        icon: "🏆",
        title: "業務經理課程",
        badge: "經營領導升級",
        intro: "經理課程聚焦策略思維、經營視角、領導影響力與績效推進，協助經理從管理單位走向經營單位，掌握組織長期發展關鍵。",

        focus: "策略思維、經營視角、領導影響力、績效推進。",

        primaryText: "查看經理課程",

      }
    };

    const detailPanel = document.getElementById("detailPanel");
    const milestones = document.querySelectorAll(".milestone");

    function renderDetail(roleKey) {
      const data = roleData[roleKey];

      detailPanel.innerHTML = `
        <div class="detail-head">
          <div class="detail-title-wrap">
            <h2>${data.title}</h2>
            <div class="detail-badge">${data.badge}</div>
          </div>
          <div class="detail-icon">${data.icon}</div>
        </div>

        <div class="detail-intro">${data.intro}</div>

        <div class="info-list">
          <div class="info-box">
            <b>適合對象</b>
            <span>${data.target}</span>
          </div>

          <div class="info-box">
            <b>訓練重點</b>
            <span>${data.focus}</span>
          </div>

          <div class="info-box">
            <b>學完收穫</b>
            <span>${data.result}</span>
          </div>
        </div>

        <div class="detail-tags">
          ${data.tags.map(tag => `<span>${tag}</span>`).join("")}
        </div>

        <div class="detail-actions">
          <a class="detail-btn primary" href="${data.primaryLink}">${data.primaryText}</a>
          <a class="detail-btn secondary" href="#" onclick="window.scrollTo({top:0, behavior:'smooth'}); return false;">回到上方</a>
        </div>
      `;
    }

    milestones.forEach(btn => {
      btn.addEventListener("click", () => {
        milestones.forEach(item => item.classList.remove("active"));
        btn.classList.add("active");
        renderDetail(btn.dataset.role);
      });
    });

    renderDetail("director");
  </script>
